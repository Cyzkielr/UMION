<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <title>UMIOM</title>
</head>
<body>
  <header>
    <div class="logo">
      <h1>UMIOM</h1>
      <small>Umamusume Inheritance Optimization Manager</small>
    </div>
    <div class="ver">
      v0.1.0
    </div>
  </header>
  <div class="container">
    <aside>
      <ul>
        <li><a href="index.html">Dashboard</a></li>
        <li><a href="supoka.html">Support Cards</a></li>
        <li><a href="uma.html">Umamusume</a></li>
        <li><a href="founders.html">Founders</a></li>
        <li><a href="config.html">Config</a></li>
        <li><a href="decks.html">Decks</a></li>
        <li><a href="settings.html">Settings</a></li>
      </ul>
    </aside>
    <main>
      <section class="panel">
        <h2>Current Mission</h2>
        <div id="mission">
          
        </div>
      </section>
      <section class="panel">
        <h2>UMIOM Dashboard</h2>
        <div id="dashboard">
          
        </div>
      </section>
      <section id="library" class="panel">
        <h2>Library</h2>
      </section>
      <section class="panel">
        <h2>Recommendation Settings</h2>
        <label>Preferred Spark</label>
        <select id="preferred-spark">
          <option value="Speed">Speed</option>
          <option value="Stamina">Stamina</option>
          <option value="Power">Power</option>
          <option value="Guts">Guts</option>
          <option value="Wit">Wit</option>
        </select>
        <br><br>
        <label>
          <input type="checkbox" id="prioritize-deck">
          Prioritize Deck Building
        </label>
        <br>
        <label>
          <input type="checkbox" id="prioritize-founder">
          Prioritize Founder Completion
        </label>
      </section>
      <section class="panel">
        <h2>Recommendation</h2>
        <div id="recommendation">
          
        </div>
      </section>
    </main>
  </div>
  <footer>
    <i>UMIOM Project</i>
  </footer>
  <script src="js/core/state.js"></script>
  <script src="js/core/storage.js"></script>
  <script src="js/core/database.js"></script>
  <script src="js/ui/renderer.js"></script>
  <script src="js/managers/supokaManager.js"></script>
  <script src="js/managers/umaManager.js"></script>
  <script src="js/managers/founderManager.js"></script>
  <script src="js/managers/deckManager.js"></script>
  <script src="js/managers/statsManager.js"></script>
  <script src="js/managers/missionManager.js"></script>
  <script src="js/managers/configManager.js"></script>
  <script src="js/constants/scoreWeights.js"></script>
  <script src="js/engine/founderRules.js"></script>
  <script src="js/engine/scoring.js"></script>
  <script src="js/engine/recoEngine.js"></script>
  <script src="js/ui/dashboardUI.js"></script>
  <script src="js/ui/recoUI.js"></script>
  <script src="js/ui/missionUI.js"></script>
  <script src="js/core/app.js"></script>
</body>
</html>
